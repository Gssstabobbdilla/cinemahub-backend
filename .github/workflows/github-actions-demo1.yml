name: Github Actions demo

run-name: ${{github.actor}} esta ejecutando un pipeline
on: [push]

jobs:
    Validar-y-Planificar:
        runs-on: ubuntu-latest
        steps:
          - name: Validar código
            run: echo "Revisando que el código Terraform no tenga errores de sintaxis."
          - name: Planificar recursos (Crear/Modificar)
            run: echo "Evaluando qué recursos de AWS se van a crear, modificar o eliminar."

    Desplegar-Dev:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Entregar la aplicación en el ambiente de Desarrollo"

    Desplegar-QA:
        runs-on: ubuntu-latest
        steps:
          - name: Desplegar en entorno de pruebas
            run: echo "Desplegando en el entorno QA de pruebas"

    Despliegar-Produccion:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Desplegar la aplicación final en el ambiente de Producción"
        
    Saludar-Hello-World:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Este job ha sido ejecutado ${{github.event_name}}"
            - run: echo "Estamos en clase infra en la sesión 9"
            - run: echo "El nombre de la rama es ${{github.ref}}. Y el repositorio es ${{github.repository}}"
            - name: Checkout repository
              uses: actions/checkout@v6
            - name: Listar los archivos del repositorio
              run: |
                ls ${{github.workspace}}
                
