name: Terraform Apply - Dev

run-name: Terraform Apply - Dev by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Selecciona APPLY para desplegar CinemaHub"
        required: true
        type: choice
        options:
          - NO
          - APPLY
        default: NO

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  terraform-apply:
    name: Terraform Apply - Dev
    if: github.ref == 'refs/heads/development' && inputs.confirm_apply == 'APPLY'
    runs-on: ubuntu-latest
    environment: dev

    defaults:
      run:
        shell: bash
        working-directory: ./iac

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: dev
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: CinemaHub-Apply-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive .

      - name: Initialize Terraform backend
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=lab09/dev/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Generate deployment plan
        run: |
          terraform plan \
            -input=false \
            -no-color \
            -lock-timeout=5m \
            -var-file=dev.tfvars.example \
            -out=tfplan

      - name: Apply deployment plan
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan

      - name: Show Terraform outputs
        run: terraform output
